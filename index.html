<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-first: scale to device width, most scans happen on a phone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="LIANGEL Beauty Studio — book and connect with us on Instagram, Facebook, TikTok and WhatsApp." />
  <meta name="theme-color" content="#7d6459" />
  <title>LIANGEL Beauty Studio</title>

  <!-- Preload the logo so the background paints as early as possible -->
  <link rel="preload" as="image" href="img/liangy_logo.PNG" />

  <style>
    /* ============================================================
       THEME — change ONE line to rebrand the accent color.
       ============================================================ */
    :root {
      --accent: #7d6459;          /* Single accent color — edit me */
      --accent-dark: #5f4b42;     /* Slightly darker for pressed/hover */
      --text: #2b2622;
      --text-soft: #6b6259;
      --page-bg: #f0eeec;
      --card-bg: rgba(255, 255, 255, 0.42);
      --card-border: rgba(255, 255, 255, 0.75);
      --btn-radius: 14px;
      --max-width: 460px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100dvh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--page-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       BACKGROUND — logo behind a frosted white "glass" layer,
       gently breathing (ease-in / ease-out scale + opacity).
       ============================================================ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: var(--page-bg);
      overflow: hidden;
    }

    .bg::before {
      content: "";
      position: absolute;
      inset: -8%;
      background: url('img/liangy_logo.PNG') center center / contain no-repeat;
      /* Watermark now strong enough to survive the wash + the card glass on top */
      opacity: 0.32;
      transform-origin: center;
      animation: breathe 6.5s ease-in-out infinite;
      will-change: transform, opacity;
    }

    /* Light frosted wash — softens the logo without erasing it.
       Kept translucent so the card's glass has something real to blur. */
    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 50% 30%,
                    rgba(255, 255, 255, 0.10) 0%,
                    rgba(255, 255, 255, 0.32) 70%,
                    rgba(255, 255, 255, 0.48) 100%);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1);    opacity: 0.28; }
      50%      { transform: scale(1.06); opacity: 0.40; }
    }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .bg::before { animation: none; }
    }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max-width);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 34px 24px 30px;
      backdrop-filter: blur(14px) saturate(1.1);
      -webkit-backdrop-filter: blur(14px) saturate(1.1);
      box-shadow: 0 18px 50px rgba(60, 48, 40, 0.14);
      text-align: center;
    }

    /* Business logo / name at the top.
       Swap the <img> in for a hosted logo, or keep the text lockup. */
    .brand-logo {
      width: 120px;
      height: auto;
      margin: 0 auto 14px;
      display: block;
      mix-blend-mode: multiply; /* drops the logo's light backdrop on the glass */
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text);
    }

    .tagline {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-soft);
      letter-spacing: 0.02em;
    }

    /* ============================================================
       BUTTONS — full-width stacked, icon + label, subtle tap state
       ============================================================ */
    .links {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: var(--btn-radius);
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(125, 100, 89, 0.28);
      transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
    }

    .btn svg { width: 22px; height: 22px; flex: 0 0 auto; }

    /* Hover (desktop) + active/tap (mobile) — fast, professional */
    @media (hover: hover) {
      .btn:hover {
        transform: translateY(-2px);
        background: var(--accent-dark);
        box-shadow: 0 8px 22px rgba(125, 100, 89, 0.34);
      }
    }
    .btn:active {
      transform: scale(0.98);
      box-shadow: 0 3px 10px rgba(125, 100, 89, 0.28);
    }
    .btn:focus-visible {
      outline: 3px solid var(--accent-dark);
      outline-offset: 3px;
    }

    .footer {
      margin-top: 22px;
      font-size: 0.72rem;
      color: var(--text-soft);
      letter-spacing: 0.04em;
    }

    @media (max-width: 360px) {
      .card { padding: 28px 18px 24px; }
      .brand-name { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <!-- Animated, frosted-glass background layer -->
  <div class="bg" aria-hidden="true"></div>

  <main class="card">
    <!-- ===== BRAND ==============================================
         Option A (default): hosted logo image.
         Option B: delete the <img> and keep only .brand-name text.
         ========================================================= -->
    <img class="brand-logo" src="img/liangy_logo.PNG" alt="LIANGEL Beauty Studio logo" />
    <h1 class="brand-name">Liangel Beauty Studio</h1>
    <p class="tagline">Where beauty meets artistry ✦ Tap to connect</p>

    <!-- ===== SOCIAL LINKS =======================================
          Placeholders are used for now.
          ========================================================= -->
    <nav class="links">
      <!-- Instagram -->
      <a class="btn" href="https://www.instagram.com/beautybyliangel?igsh=NDFoMm9ubms0cDlo&utm_source=qr" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.4" cy="6.6" r="1.3" fill="currentColor"/>
        </svg>
        <span>Instagram</span>
      </a>

      <!-- TikTok -->
      <a class="btn" href="https://www.tiktok.com/@liangelstudio?_r=1&_t=ZN-98NPlGkF1cs" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16.5 3c.3 2.2 1.6 3.6 3.7 3.8v2.5c-1.2.1-2.4-.3-3.6-1v5.9c0 4.1-3.4 6.6-6.9 5.4-2.9-1-3.8-4.7-1.7-7 1.2-1.3 3-1.7 4.6-1.2v2.7c-.4-.1-.8-.2-1.2-.1-1 .1-1.7 1-1.6 2 .1 1.1 1.2 1.8 2.3 1.5.9-.2 1.4-1 1.4-2V3h3z"/>
        </svg>
        <span>TikTok</span>
      </a>

      <!-- WhatsApp -->
      <a class="btn" href="https://wa.me/+233544231179" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.5A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-2.9.9.9-2.8-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.3-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.6-1.2.1-.1 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3c-.3.3-.9.9-.9 2.1s.9 2.5 1 2.6c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.7 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3z"/>
        </svg>
        <span>WhatsApp</span>
      </a>
    </nav>

    <p class="footer">© <span id="year"></span> Liangel Beauty Studio</p>
  </main>

  <script>
    // Tiny, non-blocking: keep the copyright year current.
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
